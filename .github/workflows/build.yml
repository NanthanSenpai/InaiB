name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q InaiBPro.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Find latest GeckoView version
        run: |
          curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-omni/maven-metadata.xml -o meta.xml || { echo "Could not fetch GeckoView metadata"; curl -sS https://maven.mozilla.org/maven2/org/mozilla/geckoview/ | head -40; exit 1; }
          cat meta.xml
          V=$(grep -o '<release>[^<]*' meta.xml | sed 's/<release>//')
          if [ -z "$V" ]; then V=$(grep -o '<version>[^<]*' meta.xml | tail -1 | sed 's/<version>//'); fi
          echo "Using GeckoView $V"
          echo "GV=$V" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: InaiBPro
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PgeckoVersion=$GV

      - uses: actions/upload-artifact@v4
        with:
          name: InaiBPro-debug-apk
          path: InaiBPro/app/build/outputs/apk/debug/app-debug.apk
