name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q InaiBPro.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Find latest GeckoView version
        run: |
          curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-omni/maven-metadata.xml -o meta.xml || { echo "Could not fetch GeckoView metadata"; curl -sS https://maven.mozilla.org/maven2/org/mozilla/geckoview/ | head -40; exit 1; }
          cat meta.xml
          # Newest release in the 135-140 range: compatible with our Android build tools.
          V=$(grep -o '<version>[^<]*' meta.xml | sed 's/<version>//' | grep -E '^(13[5-9]|140)\.' | tail -1)
          if [ -z "$V" ]; then
            echo "NO VERSION 135-140 FOUND. Versions available (last 40):"
            grep -o '<version>[^<]*' meta.xml | sed 's/<version>//' | tail -40
            exit 1
          fi
          echo "Using GeckoView $V"
          echo "GV=$V" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: InaiBPro
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PgeckoVersion=$GV 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: SHOW ERRORS HERE
        if: failure()
        run: |
          echo "===== ERROR SUMMARY ====="
          grep -n -E "^e: |error:|What went wrong|Could not|FAILED|Unresolved|not found" build.log | head -40
          grep -n -A6 "What went wrong" build.log | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: InaiBPro-debug-apk
          path: InaiBPro/app/build/outputs/apk/debug/app-debug.apk
          
