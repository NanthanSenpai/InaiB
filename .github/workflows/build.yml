name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        shell: bash
        run: |
          set -e
          unzip -q InaiBPro.zip

          if [ ! -f InaiBPro/gradlew ]; then
            echo "ERROR: InaiBPro/gradlew not found."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Find GeckoView version
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-omni/maven-metadata.xml \
            -o meta.xml

          V=$(sed -n 's:.*<release>\([^<]*\)</release>.*:\1:p' meta.xml | head -n 1)

          if [ -z "$V" ]; then
            V=$(grep -o '<version>[^<]*' meta.xml | sed 's/<version>//' | tail -n 1)
          fi

          if [ -z "$V" ]; then
            echo "ERROR: Could not determine GeckoView version."
            exit 1
          fi

          echo "Using GeckoView version: $V"
          echo "GV=$V" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        working-directory: InaiBPro
        run: |
          set -o pipefail

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -PgeckoVersion="$GV" \
            2>&1 | tee ../build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo "========== ERROR SUMMARY =========="

          if [ -f build.log ]; then
            grep -n -i -E \
              'error:|what went wrong|could not|failed|unresolved|not found|requires libraries|compile against version' \
              build.log | head -80 || true

            echo "========== FAILURE DETAILS =========="

            grep -n -A12 -B3 'What went wrong' \
              build.log | head -80 || true

            echo "========== LAST 100 LOG LINES =========="

            tail -100 build.log
          else
            echo "No build.log was found."
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InaiBPro-debug-apk
          path: InaiBPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
